<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="CGV, Controle Geral de Volantes">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b2b"/>
      <stop offset="1" stop-color="#0b6b6b"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddbd9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3ddbd9"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="borda"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .nome{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
    .frase{font:500 28px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fd8ff;opacity:0;animation:troca 12s infinite}
    .f2{animation-delay:4s}.f3{animation-delay:8s}
    .cod{font:400 18px Consolas,'Courier New',monospace;fill:#6ea8fe;opacity:.55}
    .cursor{fill:#3ddbd9;animation:pisca 1s steps(1) infinite}
    .faixa{animation:corre 6s linear infinite}
    .no{fill:#3ddbd9;animation:pulsa 3s ease-in-out infinite}
    .n2{animation-delay:1s}.n3{animation-delay:2s}
    .entra{animation:sobe 1.2s ease-out both}
    @keyframes troca{0%,2%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes pisca{50%{opacity:0}}
    @keyframes corre{from{transform:translateX(-600px)}to{transform:translateX(1200px)}}
    @keyframes pulsa{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes sobe{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.frase{opacity:0}.f1{opacity:1}}
  </style>
  <g clip-path="url(#borda)">
    <rect width="1200" height="300" fill="url(#fundo)"/>
    <g stroke="#6ea8fe" stroke-opacity=".18" stroke-width="1.5" fill="none">
      <path d="M820 60H960L1000 100H1120"/><path d="M780 150H900L940 190H1140"/><path d="M860 240H1010L1040 210H1160"/>
    </g>
    <circle class="no" cx="1120" cy="100" r="6"/><circle class="no n2" cx="1140" cy="190" r="6"/><circle class="no n3" cx="1160" cy="210" r="6"/>
    <text class="cod" x="820" y="48">&lt;?php // cobertura de postos</text>
    <g class="entra">
      <text class="nome" x="70" y="130">CGV</text>
      <rect class="cursor" x="208" y="78" width="6" height="58"/>
    </g>
    <text class="frase f1" x="72" y="190">Controle Geral de Volantes</text>
    <text class="frase f2" x="72" y="190">Nenhum posto de serviço descoberto</text>
    <text class="frase f3" x="72" y="190">PHP · MariaDB · JavaScript · Docker</text>
    <rect class="faixa" x="0" y="232" width="600" height="3" fill="url(#luz)"/>
    <text class="cod" x="72" y="268">por Igor Wendel · versão de portfólio</text>
  </g>
</svg>
